<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.png" />
    <title>Em Construção — Thairlan Anjos</title>
    <meta name="description" content="Site em construção — Thairlan Anjos." />
    <meta property="og:title" content="Em Construção — Thairlan Anjos" />
    <meta property="og:description" content="Site em construção — Thairlan Anjos." />
    <meta property="og:type" content="website" />

    <!-- Fontes do site original -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Petrona:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #f7f6f3;
        --accent: #1a2238;
        --muted: #666666;
        --font-heading: "Instrument Serif", serif;
        --font-body: "Petrona", serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a2238;
          --accent: #f7f6f3;
          --muted: #999999;
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        width: 100%;
      }

      body {
        font-family: var(--font-body);
        background: var(--bg);
        color: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        transition: background-color 0.5s, color 0.5s;
        overflow: hidden;
      }

      .container {
        max-width: 450px;
        width: 100%;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .emoji-container {
        font-size: 64px;
        margin-bottom: 24px;
        display: inline-block;
        animation: float 3s ease-in-out infinite;
      }

      h1 {
        font-family: var(--font-heading);
        font-size: clamp(36px, 8vw, 48px);
        font-weight: normal;
        line-height: 1.2;
        margin-bottom: 16px;
        letter-spacing: -0.5px;
      }

      .divider {
        width: 60px;
        height: 1px;
        background-color: var(--accent);
        opacity: 0.2;
        margin-bottom: 20px;
      }

      p {
        font-size: 16px;
        line-height: 1.6;
        color: var(--muted);
        max-width: 320px;
      }

      @keyframes float {
        0%, 100% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(-10px) rotate(5deg);
        }
      }
    </style>
  </head>
  <body>
    <main class="container" id="main-content">
      <div class="emoji-container" aria-hidden="true">🚧</div>
      <h1>Site em Construção</h1>
      <div class="divider"></div>
      <p>Novidades em breve. Por favor, volte mais tarde.</p>
    </main>
  </body>
</html>
